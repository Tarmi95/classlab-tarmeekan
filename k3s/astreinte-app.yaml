apiVersion: apps/v1
kind: Deployment
metadata:
  name: astreinte-app
  labels:
    app: astreinte-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: astreinte-app
  template:
    metadata:
      labels:
        app: astreinte-app
    spec:
      containers:
      - name: astreinte-app
        image: ftutorials/python-app
        ports:
        - containerPort: 5000
---

apiVersion: v1
kind: Service
metadata:
  name: astreinte-app-svc
  labels:
    app: astreinte-app
spec:
  selector:
    app: astreinte-app
  ports:
  - name: http
    protocol: TCP
    port: 80        
    targetPort: 5000    
  type: ClusterIP