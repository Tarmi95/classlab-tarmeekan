apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-app
  labels:
    app: quiz-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-app
  template:
    metadata:
      labels:
        app: quiz-app
    spec:
      containers:
      - name: quiz-app
        image: ftutorials/quiz:devops
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-app-svc
  labels:
    app: quiz-app
spec:
  selector:
    app: quiz-app
  ports:
  - name: http
    protocol: TCP
    port: 80       
    targetPort: 3000   
  type: ClusterIP  
