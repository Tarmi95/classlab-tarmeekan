apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  labels:
    app.kubernetes.io/name: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-app
    spec:
      containers:
      - image: nginx
        name: web-app
        command:
          - /bin/sh
          - -c
          - "echo 'Felicitations, vous avez reussi a deployer votre application web !' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"

---

apiVersion: v1
kind: Service
metadata:
  name: web-app
  labels:
    app.kubernetes.io/name: web-app
spec:
  selector:
    app.kubernetes.io/name: web-app
  ports:
  - name: http
    port: 80             # port interne exposé au cluster
    protocol: TCP        # port sur lequel le conteneur écoute
    targetPort: 80
  type: ClusterIP  