apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-docker
  labels:
    app: quiz-docker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-docker
  template:
    metadata:
      labels:
        app: quiz-docker
    spec:
      containers:
      - name: quiz-docker
        image: ftutorials/quiz:version4
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-docker-svc
  labels:
    app: quiz-docker
spec:
  selector:
    app: quiz-docker
  ports:
  - name: http
    protocol: TCP
    port: 80       
    targetPort: 3000   
  type: ClusterIP  
